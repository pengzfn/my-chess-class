<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格兰开局 - 大师复盘</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    
    <script src="chess-logic.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); /* 深紫色大师风格 */
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden; /* 防止双滚动条 */
        }

        .container {
            display: flex;
            gap: 20px;
            height: 90vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 磨砂玻璃卡片通用样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 左侧边栏 */
        .sidebar {
            flex: 0 0 300px;
            overflow-y: auto;
        }

        .category-header {
            background: rgba(102, 126, 234, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .arrow { transition: transform 0.3s; }

        .variation-list {
            display: block; /* 默认展开，防止用户以为变例少了 */
            padding-left: 10px;
            margin-top: 5px;
        }

        .variation-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #ccc;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .variation-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding-left: 12px;
        }

        /* 中间棋盘区 */
        .board-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #myBoard {
            width: 480px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover { background: #764ba2; }

        /* 右侧解说区 */
        .info-area {
            flex: 0 0 250px;
            overflow-y: auto;
        }
        
        #statusInfo { font-size: 1.2em; color: #4fd1c5; margin-bottom: 10px; }
        .hint-content ul { padding-left: 20px; color: #a0aec0; }
        .hint-content li { margin-bottom: 5px; }

        /* 调试信息 */
        #fenDebug { font-size: 10px; color: #555; margin-top: 10px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar glass-card">
        <h3>♟️ 变例库</h3>
        
        <div class="category-header" onclick="toggleSidebarCategory(this)">
            <span>主线理论</span>
            <span class="arrow" style="transform: rotate(90deg)">▶</span>
        </div>
        <div class="variation-list">
            <button class="variation-btn" onclick="selectVariation('mainline')">1. 主线 (3...exd4)</button>
            <button class="variation-btn" onclick="selectVariation('classical')">2. 经典变例 (Bc5)</button>
            <button class="variation-btn" onclick="selectVariation('mieses')">3. Mieses变例 (Nf6)</button>
        </div>

        <div class="category-header" onclick="toggleSidebarCategory(this)">
            <span>⚠️ 常见陷阱</span>
            <span class="arrow" style="transform: rotate(90deg)">▶</span>
        </div>
        <div class="variation-list">
            <button class="variation-btn" style="color:#fc8181" onclick="selectVariation('trap_qh4')">1. 过早出后 (Qh4??)</button>
            <button class="variation-btn" style="color:#fc8181" onclick="selectVariation('trap_f7')">2. f7 点突破</button>
        </div>
    </div>

    <div class="board-area">
        <div id="statusInfo">准备就绪</div>
        <div id="myBoard"></div>
        <div class="controls">
            <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
            <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
            <button class="btn" onclick="ChessApp.nextMove()">下一步 ▶</button>
            <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
        </div>
        <div id="fenDebug"></div>
    </div>

    <div class="info-area glass-card">
        <div id="hintText" class="hint-content">
            <h3>欢迎来到大师复盘室</h3>
            <p>请点击左侧的变例名称开始学习。你可以直接在棋盘上走棋，也可以点击“下一步”按钮演示标准走法。</p>
        </div>
    </div>
</div>

<script>
    // 定义变例数据
    const VARIATIONS = {
        mainline: {
            title: "苏格兰开局主线",
            fen: "rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3",
            description: "黑方接受交换是目前最主流的走法。",
            moves: ["exd4", "Nxd4", "Nf6", "Nc3", "Bb4"],
            steps: ["3...exd4 吃掉中心兵", "4.Nxd4 白方吃回", "4...Nf6 攻击e4兵", "5.Nc3 保护", "5...Bb4 牵制马"]
        },
        classical: {
            title: "经典变例 (Bc5)",
            fen: "rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3",
            description: "黑方出象到c5，给白方中心马施加压力。",
            moves: ["exd4", "Nxd4", "Bc5", "Be3", "Qf6"],
            steps: ["3...exd4", "4.Nxd4", "4...Bc5 控制中心", "5.Be3 保护马", "5...Qf6 增加压力"]
        },
        mieses: {
            title: "Mieses 变例",
            fen: "rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3",
            description: "这是卡斯帕罗夫钟爱的变例，导致非常尖锐的局面。",
            moves: ["exd4", "Nxd4", "Nf6", "Nxc6", "bxc6", "e5"],
            steps: ["3...exd4", "4.Nxd4", "4...Nf6", "5.Nxc6 交换", "5...bxc6", "6.e5! 赶马"]
        },
        trap_qh4: {
            title: "陷阱：过早出后",
            fen: "rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3",
            description: "黑方试图快速攻击，但会因此丢先手。",
            moves: ["Qh4", "Nc3", "Bb4", "Be2", "Qxe4", "Nb5"],
            steps: ["3...Qh4? 坏棋", "4.Nc3", "4...Bb4", "5.Be2! 弃兵", "5...Qxe4 吃兵", "6.Nb5! 威胁c7"]
        },
        trap_f7: {
            title: "陷阱：f7 弱点",
            fen: "r1bqkbnr/pppp1ppp/2n5/4p3/2BPP3/5N2/PPP2PPP/RNBQK2R b KQkq - 0 3",
            description: "如果黑方不小心，白方会利用f7点进行突破。",
            moves: ["exd4", "Ng5", "Nh6", "Nxf7", "Nxf7", "Bxf7", "Kxf7", "Qh5"],
            steps: ["3...exd4", "4.Ng5! 瞄准f7", "4...Nh6", "5.Nxf7! 弃马", "5...Nxf7", "6.Bxf7+ 弃象", "7.Qh5+ 抽杀"]
        }
    };

    // 桥接函数：处理点击事件
    function selectVariation(key) {
        if (VARIATIONS[key]) {
            window.ChessApp.loadVariation(VARIATIONS[key]);
        }
    }

    // 页面加载完成后初始化
    $(document).ready(function() {
        // 苏格兰开局初始状态：1.e4 e5 2.Nf3 Nc6 3.d4 (轮到黑方走)
        var startFen = 'rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3';
        
        // 启动应用
        window.ChessApp.init('myBoard', startFen);
        
        // 默认加载第一个变例的介绍文字，但不走棋
        selectVariation('mainline');
        window.ChessApp.reset(); // 重置回未走棋状态
    });
</script>

</body>
</html>
