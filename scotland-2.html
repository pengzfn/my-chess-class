<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格兰开局 - 大师复盘课</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .back-button {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateX(-5px);
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 左侧边栏 */
        .sidebar {
            flex: 0 0 30%;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-height: 800px;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .category {
            margin-bottom: 20px;
        }
        .category-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .category-title:hover {
            transform: translateX(5px);
        }
        .category-title .arrow {
            transition: transform 0.3s ease;
        }
        .category-title.active .arrow {
            transform: rotate(90deg);
        }
        .variation-list {
            display: none;
            padding-top: 10px;
        }
        .variation-list.show {
            display: block;
        }
        .variation-item {
            padding: 12px 15px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .variation-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        .variation-item.active {
            background: #f0e6ff;
            border-left-color: #764ba2;
            font-weight: bold;
        }
        /* 右侧主区域 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .board-container {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #myBoard {
            width: 100%;
            max-width: 500px;
        }
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .control-btn:active {
            transform: translateY(-1px);
        }
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .hint-area {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .hint-area h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .hint-text {
            color: #2c3e50;
            line-height: 1.8;
            font-size: 1.05em;
        }
        .move-counter {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.9em;
        }
        /* 响应式布局 */
        @media (max-width: 968px) {
            .container {
                flex-direction: column-reverse;
            }
            .sidebar {
                flex: none;
                width: 100%;
            }
        }
        /* 滚动条美化 */
        .sidebar::-webkit-scrollbar {
            width: 8px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <a href="scotland-intro.html" class="back-button">← 返回目录</a>

    <div class="container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <h2>♟️ 大师复盘课</h2>
            
            <!-- 开局理论 -->
            <div class="category">
                <div class="category-title" onclick="toggleCategory(this)">
                    <span>📚 开局理论</span>
                    <span class="arrow">▶</span>
                </div>
                <div class="variation-list">
                    <div class="variation-item" onclick="loadVariation(this, 1)">
                        变例1：经典主线 3...exd4
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 2)">
                        变例2：黑方拒兑 3...Nf6
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 3)">
                        变例3：中心控制战略
                    </div>
                </div>
            </div>

            <!-- 经典对局 -->
            <div class="category">
                <div class="category-title" onclick="toggleCategory(this)">
                    <span>⚔️ 经典对局</span>
                    <span class="arrow">▶</span>
                </div>
                <div class="variation-list">
                    <div class="variation-item" onclick="loadVariation(this, 4)">
                        卡斯帕罗夫 vs 卡尔波夫 1990
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 5)">
                        费舍尔经典案例
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 6)">
                        现代大师实战
                    </div>
                </div>
            </div>

            <!-- 陷阱与错误 -->
            <div class="category">
                <div class="category-title" onclick="toggleCategory(this)">
                    <span>⚠️ 陷阱与错误</span>
                    <span class="arrow">▶</span>
                </div>
                <div class="variation-list">
                    <div class="variation-item active" onclick="loadVariation(this, 7)">
                        陷阱1：黑方贸然出后
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 8)">
                        陷阱2：忽视中心控制
                    </div>
                    <div class="variation-item" onclick="loadVariation(this, 9)">
                        陷阱3：过早兑换子力
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧主区域 -->
        <div class="main-area">
            <!-- 棋盘区域 -->
            <div class="board-container">
                <div id="myBoard"></div>
                <div class="move-counter" id="moveCounter">第 0 步 / 共 0 步</div>
                
                <!-- 控制按钮 -->
                <div class="controls">
                    <button class="control-btn" onclick="resetBoard()">|&lt; 重置</button>
                    <button class="control-btn" id="prevBtn" onclick="previousMove()">&lt; 上一步</button>
                    <button class="control-btn" id="nextBtn" onclick="nextMove()">下一步 &gt;</button>
                    <button class="control-btn" onclick="flipBoard()">🔄 翻转棋盘</button>
                </div>
            </div>

            <!-- 提示区域 -->
            <div class="hint-area">
                <h3>📝 局面解说</h3>
                <p class="hint-text" id="hintText">
                    点击左侧列表，开始复盘...
                </p>
            </div>
        </div>
    </div>

    <!-- 引入必要的库 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script>
        // 全局变量
        var board = null;
        var game = new Chess();
        var moveHistory = [];
        var currentMoveIndex = -1;

        // 棋盘配置
        var config = {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        // 初始化棋盘
        board = Chessboard('myBoard', config);

        // 折叠菜单功能
        function toggleCategory(element) {
            element.classList.toggle('active');
            var list = element.nextElementSibling;
            list.classList.toggle('show');
        }

        // 变例数据库
        var variations = {
            1: {
                moves: ['e4', 'e5', 'Nf3', 'Nc6', 'd4', 'exd4', 'Nxd4'],
                title: '经典主线 3...exd4',
                description: '白方走 1.e4 e5 2.Nf3 Nc6 3.d4，这是苏格兰开局的标志性走法。黑方最常见的应对是 3...exd4，接受中兵交换。白方用骑士吃回，占据中心要地。',
                steps: [
                    '开局：双方各走 e4 和 e5，抢占中心。',
                    '白方出骑士 Nf3，攻击黑方的 e5 兵。',
                    '黑方出骑士 Nc6 保护中兵。',
                    '白方走 d4！这是苏格兰开局的关键一步，打开中心。',
                    '黑方吃兵 exd4，接受交换。',
                    '白方 Nxd4 吃回，骑士占据强势中心位置。'
                ]
            },
            2: {
                moves: ['e4', 'e5', 'Nf3', 'Nc6', 'd4', 'Nf6'],
                title: '黑方拒兑 3...Nf6',
                description: '黑方选择不立即吃兵，而是发展骑士到 f6。这是一种更加稳健的应对方式，避免早期的激烈对抗。',
                steps: [
                    '开局：1.e4 e5 2.Nf3 Nc6',
                    '白方走 3.d4，打开中心',
                    '黑方不吃兵，而是走 3...Nf6，发展子力',
                    '这是一种稳健的选择，保持棋局的平衡'
                ]
            },
            7: {
                moves: ['e4', 'e5', 'Nf3', 'Nc6', 'd4', 'Qh4'],
                title: '陷阱：黑方贸然出后',
                description: '如果黑方过早出动皇后（如 3...Qh4），会被白方利用发展优势进行反击。记住：不要在开局阶段让皇后成为攻击目标！',
                steps: [
                    '开局：1.e4 e5 2.Nf3 Nc6',
                    '白方走 3.d4',
                    '黑方犯错：3...Qh4？？过早出后！',
                    '白方可以继续发展，黑后将成为攻击目标',
                    '教训：开局阶段，先发展轻子，不要过早动后'
                ]
            }
        };

        // 加载变例
        function loadVariation(element, id) {
            // 移除所有激活状态
            document.querySelectorAll('.variation-item').forEach(item => {
                item.classList.remove('active');
            });
            // 添加当前激活状态
            element.classList.add('active');

            // 获取变例数据
            var variation = variations[id] || variations[7];
            
            // 重置游戏
            game.reset();
            moveHistory = variation.moves;
            currentMoveIndex = -1;

            // 重置棋盘到起始位置
            board.position('start');
            
            // 更新提示文本
            updateHintText(variation);
            updateMoveCounter();
            updateButtons();
        }

        // 更新提示文本
        function updateHintText(variation) {
            var html = '<strong>' + variation.title + '</strong><br><br>';
            html += variation.description + '<br><br>';
            html += '<strong>步骤说明：</strong><ul>';
            variation.steps.forEach(function(step) {
                html += '<li>' + step + '</li>';
            });
            html += '</ul>';
            document.getElementById('hintText').innerHTML = html;
        }

        // 更新步数计数器
        function updateMoveCounter() {
            var total = moveHistory.length;
            var current = currentMoveIndex + 1;
            document.getElementById('moveCounter').textContent = 
                '第 ' + current + ' 步 / 共 ' + total + ' 步';
        }

        // 更新按钮状态
        function updateButtons() {
            document.getElementById('prevBtn').disabled = (currentMoveIndex < 0);
            document.getElementById('nextBtn').disabled = (currentMoveIndex >= moveHistory.length - 1);
        }

        // 重置棋盘
        function resetBoard() {
            console.log('重置棋盘');
            game.reset();
            board.position('start');
            currentMoveIndex = -1;
            updateMoveCounter();
            updateButtons();
            document.getElementById('hintText').innerHTML = '棋盘已重置到初始位置。点击"下一步"开始复盘。';
        }

        // 上一步
        function previousMove() {
            if (currentMoveIndex < 0) return;
            
            game.undo();
            currentMoveIndex--;
            board.position(game.fen());
            updateMoveCounter();
            updateButtons();
            
            console.log('上一步');
        }

        // 下一步
        function nextMove() {
            if (currentMoveIndex >= moveHistory.length - 1) return;
            
            currentMoveIndex++;
            var move = moveHistory[currentMoveIndex];
            game.move(move);
            board.position(game.fen());
            updateMoveCounter();
            updateButtons();
            
            console.log('下一步: ' + move);
        }

        // 翻转棋盘
        function flipBoard() {
            console.log('翻转棋盘');
            board.flip();
            document.getElementById('hintText').innerHTML = '棋盘已翻转视角。';
        }

        // 响应式调整
        $(window).resize(board.resize);

        // 页面加载时默认展开第三个分类并加载第一个变例
        window.addEventListener('load', function() {
            document.querySelectorAll('.category-title')[2].click();
            // 加载默认变例
            loadVariation(document.querySelector('.variation-item.active'), 7);
        });
    </script>

</body>
</html>
