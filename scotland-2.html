<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二讲：经典陷阱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

    <div style="width: 100%; max-width: 800px;">
        <a href="scotland-intro.html" class="back-button">← 返回目录</a>
    </div>

    <div class="chess-container">
        <h1>♟️ 第二讲：经典陷阱</h1>
        
        <div class="board-wrapper">
            <div id="myBoard" style="width: 100%; max-width: 400px;"></div>
            
            <div style="margin-top: 20px; width: 100%;">
                <h3 style="color: #2e7d32;">局面分析：</h3>
                <p>白方走 <strong>1. e4 e5 2. Nf3 Nc6 3. d4</strong></p>
                <p>强行打开中心！这是苏格兰开局的标志性特征。</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script>
        // 初始化棋盘
        var config = {
            position: 'rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3', // 苏格兰开局
            draggable: true
        };
        var board = Chessboard('myBoard', config);

        // 手机屏幕适配
        window.addEventListener('resize', function() {
            board.resize();
        });
    </script>

</body>
</html>
