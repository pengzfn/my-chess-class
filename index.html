<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹏子国际象棋课堂</title>
    <style>
        /* 这里的代码就是为了复刻那个瑜伽网站的绿色风格 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f9f4; /* 淡淡的薄荷绿背景 */
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #27ae60; /* 瑜伽绿标题 */
            margin-bottom: 30px;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        /* 漂亮的卡片样式 */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px); /* 鼠标放上去会浮起来 */
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.2);
        }
        .card-header {
            background-color: #e8f5e9; /* 卡片顶部的浅绿色 */
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #2e7d32;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body {
            padding: 20px;
            line-height: 1.6;
        }
        .status-tag {
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <h1>♟️ 鹏子国际象棋课堂</h1>

    <div class="card-container">
        <a href="scotland-2.html" class="card">
            <div class="card-header">
                苏格兰开局
                <span class="status-tag">第二讲</span>
            </div>
            <div class="card-body">
                <p>我们要学的第一个强力开局！<br>
                控制中心，主动出击。<br>
                <strong>点击进入课程 &rarr;</strong></p>
            </div>
        </a>

        <div class="card">
            <div class="card-header">
                意大利开局
                <span style="background:#ccc" class="status-tag">待更新</span>
            </div>
            <div class="card-body">
                <p>经典的开放性开局。<br>
                适合初学者掌握棋理。<br>
                (课程制作中...)</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                每日战术
                <span style="background:#ccc" class="status-tag">待更新</span>
            </div>
            <div class="card-body">
                <p>每天三道题，<br>
                也就是赢棋的关键！<br>
                (题目准备中...)</p>
            </div>
        </div>
    </div>

</body>
</html>
