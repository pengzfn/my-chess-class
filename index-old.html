/* --- UI 样式 (Master Version) --- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; overflow: hidden; display: flex; color: #333; }
.sidebar { width: 320px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 20px rgba(0,0,0,0.1); }
.sidebar-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;}
.sidebar-header h1 { font-size: 1.2rem; font-weight: 600; margin:0; }
.reset-btn { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
.sidebar-content { flex: 1; padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.group-l1 { margin-bottom: 12px; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.group-l1-header { background: #f8f9fa; padding: 12px 16px; font-weight: 600; color: #4a148c; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
.group-l1-content { display: block; }
.group-l2-header { padding: 10px 16px; background: #fff; font-size: 0.9rem; color: #666; cursor: pointer; display: flex; justify-content: space-between; padding-left: 24px; border-top: 1px solid #f9f9f9; }
.group-l2-content { display: block; }
.pgn-item { padding: 12px 16px 12px 36px; cursor: pointer; font-size: 0.95rem; border-left: 4px solid transparent; border-bottom: 1px solid #f9f9f9; color: #444; }
.pgn-item.selected { background: #f3e5f5; border-left-color: #7b1fa2; color: #4a148c; font-weight: 600; }
.main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.board-container { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }
.board-title { text-align: center; margin-bottom: 16px; color: #5a2e5a; font-size: 1.1rem; font-weight: 700; min-height: 1.4em; }
#board { width: 100%; margin-bottom: 20px; border-radius: 4px; overflow: hidden; }
.controls { display: flex; gap: 12px; margin-bottom: 20px; width: 100%; justify-content: center; }
.btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 0; width: 80px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(106, 17, 203, 0.3); }
.btn-flip { background: #ff758c; box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3); }
.commentary-area { width: 100%; padding: 16px; background: #f3e5f5; border-radius: 12px; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
#commentText { color: #4a148c; line-height: 1.6; font-size: 1rem; font-weight: 500; }
#moveInfo { margin-top: 8px; font-size: 0.85rem; color: #8e24aa; text-align: right; opacity: 0.8; }
@media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: 35vh; } .main-area { height: 65vh; padding: 10px; } #board { max-width: 360px; } .sidebar-header { flex-direction: row; justify-content: space-between; padding: 12px 20px; } }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header"><h1>♟️ 大师复盘课</h1><button class="reset-btn" onclick="resetSystem()">🔄 一键重置</button></div>
  <div class="sidebar-content" id="sidebarContent"></div>
</div>
<div class="main-area">
  <div class="board-container">
    <div class="board-title" id="boardTitle">请选择课程</div>
    <div id="board"></div>
    <div class="controls"><button class="btn" onclick="goToStart()">|&lt;</button><button class="btn" onclick="goToPrevious()">&lt;</button><button class="btn" onclick="goToNext()">&gt;</button><button class="btn btn-flip" onclick="flipBoard()">翻转</button></div>
    <div class="commentary-area"><div id="commentText">点击左侧列表，开始复盘...</div><div id="moveInfo"></div></div>

// --- 核心逻辑 ---
let board, game = new Chess(), currentLesson = null, stepIndex = -1;
$(function() { board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' }); renderSidebar(); });
function renderSidebar() {
  const $con = $('#sidebarContent').empty(); const groups = {};
  CHESS_DATA.forEach((d, i) => { if(!groups[d.groupL1]) groups[d.groupL1]={}; if(!groups[d.groupL1][d.groupL2]) groups[d.groupL1][d.groupL2]=[]; groups[d.groupL1][d.groupL2].push({...d, idx: i}); });
  Object.keys(groups).forEach(l1 => {
    const $l1 = $(`<div class="group-l1"><div class="group-l1-header">${l1}<span>▼</span></div><div class="group-l1-content"></div></div>`);
    $l1.find('.group-l1-header').click(function(){ $(this).next().slideToggle(200); });
    Object.keys(groups[l1]).forEach(l2 => {
      const $l2 = $(`<div class="group-l2"><div class="group-l2-header">${l2}<span>▼</span></div><div class="group-l2-content"></div></div>`);
      $l2.find('.group-l2-header').click(function(){ $(this).next().slideToggle(200); });
      groups[l1][l2].forEach(item => { $l2.find('.group-l2-content').append(`<div class="pgn-item" onclick="loadGame(${item.idx}, this)">${item.name}</div>`); });
      $l1.find('.group-l1-content').append($l2);
    });
    $con.append($l1);
  });
}
window.loadGame = function(idx, el) { $('.pgn-item').removeClass('selected'); if(el) $(el).addClass('selected'); currentLesson = CHESS_DATA[idx]; $('#boardTitle').text(currentLesson.name); goToStart(); }
window.resetSystem = function() { currentLesson = null; goToStart(); $('#boardTitle').text("请选择课程"); $('#commentText').text("点击左侧列表，开始复盘..."); $('.pgn-item').removeClass('selected'); $('.group-l1-content').show(); }
window.goToStart = function() { stepIndex = -1; game.reset(); board.position('start'); updateUI(); }
window.goToPrevious = function() { if(stepIndex >= 0) { game.undo(); board.position(game.fen()); stepIndex--; updateUI(); } }
window.goToNext = function() { if(currentLesson && stepIndex < currentLesson.moves.length-1) { stepIndex++; game.move(currentLesson.moves[stepIndex]); board.position(game.fen()); updateUI(); } }
window.flipBoard = function() { board.flip(); }
function updateUI() {
  let txt = "准备开始... 请点击 [ > ]", info = "";
  if(stepIndex >= 0) { txt = currentLesson.comments[stepIndex] || "（此步无评注）"; info = `第 ${Math.floor(stepIndex/2)+1} 回合 · ${stepIndex%2===0?"白":"黑"}`; }
  $('#commentText').text(txt); $('#moveInfo').text(info);
}
$(document).on('keydown', function(e) { if(e.key === "ArrowRight") goToNext(); if(e.key === "ArrowLeft") goToPrevious(); });
