<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格兰开局 - 第三讲：Mieses 变例深度解析</title>

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <!-- Local CSS & JS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/scotland-data.js"></script>
    <script src="../assets/js/chess-logic.js"></script>
</head>

<body>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="scotland-intro.html" class="nav-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                返回目录
            </a>
            <span class="nav-title">第三讲：Mieses 变例深度解析</span>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <h3>⚔️ Mieses 变例</h3>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>核心理论</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('mieses_intro')">1. 为什么选择 Mieses？</button>
                <button class="variation-btn" onclick="selectVariation('main_line')">2. 主线：e5 兵的压制</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>常见陷阱与错误</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn text-danger" onclick="selectVariation('mistake_nd5')">3.
                    错误：6...Nd5?</button>
                <button class="variation-btn text-danger" onclick="selectVariation('mistake_g6')">4.
                    错误：9...g6?</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>实战演示</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('game_demo')">5. 精彩对局：惩罚 g6</button>
            </div>
        </div>

        <div class="board-area">
            <div id="statusInfo">准备就绪</div>
            <div id="myBoard"></div>
            <div class="controls">
                <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
                <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
                <button class="btn btn-primary" onclick="ChessApp.nextMove()">下一步 ▶</button>
                <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
            </div>
            <div id="fenDebug"></div>
        </div>

        <div class="info-area">
            <div id="hintText" class="hint-content">
                <h3>特级大师 Alexander Delchev 讲座</h3>
                <p>本节课深入分析苏格兰开局中最尖锐的 Mieses 变例 (4...Nf6)。</p>
                <p><strong>核心思想：</strong>白方利用 e5 兵挤压黑方空间，并利用异向易位发起猛烈进攻。</p>
            </div>
        </div>
    </div>

    <script>
        // 使用外部数据文件
        const VARIATIONS = window.SCOTLAND_3_DATA;

        // 桥接函数：处理点击事件
        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
            } else {
                console.error('变例不存在:', key);
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function () {
            // 苏格兰开局初始状态 - 与变例数据一致
            var startFen = 'r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq d3 0 3';

            // 启动应用
            window.ChessApp.init('myBoard', startFen);

            // 默认加载第一个变例
            selectVariation('mieses_intro');
        });
    </script>

</body>

</html>
