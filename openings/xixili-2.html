        <div class="info-area">
            <div id="hintText" class="hint-content">
                <h3>西西里防御 - e6 体系 (Sicilian Defense - e6 Complex)</h3>
                <p>e6 西西里防御是一种融合了灵活阵地战与反击潜力的开局体系。它比 d6 体系（如纳杰尔多夫）更稳健，控制中心的同时保留了 d5 冲兵的可能性，并可根据白方的选择转变为泰曼诺夫、坎恩或舍维宁根等变例。</p>
            </div>
        </div>

    <script>

                    "5...d6 被迫防守。",
                    "6.Bf4 继续施压 d6 兵。",
                    "6...e5 反击象，但造成了 d5 落后兵和弱格。",
                    "7.Bg5 此时局面转变为斯维什尼科夫变例 (Sveshnikov Variation)。"
                ]
            },
            kan: {
                title: "坎恩变例 (Kan Variation)",
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "4... a6 是坎恩变例，特点是极其灵活，黑方推迟出马，保留兵形变化的可能。",

        // 桥接函数：处理点击事件
        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
                // 侧边栏高亮：与 style.css 的 .variation-btn.active 对齐
                document.querySelectorAll('.variation-btn').forEach(btn => btn.classList.remove('active'));
                const selector = `.variation-btn[onclick*="selectVariation('${key}')"]`;
                const activeBtn = document.querySelector(selector);
                if (activeBtn) activeBtn.classList.add('active');
            } else {
                console.error('变例不存在:', key);
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function () {
            // 从标准开局位置开始（FEN: 初始棋盘）
            var startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

            // 启动应用
            window.ChessApp.init('myBoard', startFen);

            // 默认加载第一个变例
            selectVariation('main_line');
        });
    </script>
