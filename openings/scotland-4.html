<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格兰开局 - 第四讲：斯坦尼茨变例</title>

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <!-- Local CSS & JS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/scotland-data.js"></script>
    <script src="../assets/js/chess-logic.js"></script>
</head>

<body>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="scotland-intro.html" class="nav-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                返回目录
            </a>
            <span class="nav-title">第四讲：斯坦尼茨变例</span>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <h3>⚔️ 斯坦尼茨变例</h3>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>冷门陷阱</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('d5_trap')">1. 冷门：4...d5 变例</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>主线理论</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('steinitz_main')">2. 主线：4...Qh4</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>实战变例</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('mitkov_variation')">3. Mitkov 改进
                    (6...Nf6)</button>
            </div>
        </div>

        <div class="board-area">
            <div id="statusInfo">准备就绪</div>
            <div id="myBoard"></div>
            <div class="controls">
                <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
                <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
                <button class="btn btn-primary" onclick="ChessApp.nextMove()">下一步 ▶</button>
                <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
            </div>
            <div id="fenDebug"></div>
        </div>

        <div class="info-area">
            <div id="hintText" class="hint-content">
                <h3>斯坦尼茨变例 (4...Qh4)</h3>
                <p>这是苏格兰开局中一个非常古老且激进的变例，得名于首位世界冠军威廉·斯坦尼茨。</p>
                <p><strong>核心思想：</strong>黑方早早出后试图掠夺 e4 兵并制造混乱。白方应弃兵换取出子速度优势。</p>
            </div>
        </div>
    </div>

    <script>
        // 使用外部数据文件
        const VARIATIONS = window.SCOTLAND_4_DATA;

        // 桥接函数：处理点击事件
        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
            } else {
                console.error('变例不存在:', key);
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function () {
            // 从标准开局位置开始（FEN: 初始棋盘）
            var startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

            // 启动应用
            window.ChessApp.init('myBoard', startFen);

            // 默认加载第一个变例
            selectVariation('d5_trap');
        });
    </script>

</body>

</html>
