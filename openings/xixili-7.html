<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西西里防御 - 第七讲：闭式西西里（g3 体系）</title>

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <!-- Local CSS & JS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/chess-logic.js"></script>
</head>

<body>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="../index.html" class="nav-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                返回首页
            </a>
            <a href="xixili-intro.html" class="nav-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                返回目录
            </a>
            <span class="nav-title">第七讲：闭式西西里（g3 体系）</span>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <h3>🏰 闭式西西里 g3</h3>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>主线理论</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('main_line')">主线：g3 王翼菲安凯托</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>变例与分支</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('variation_a')">变例 A：开放西西里转置</button>
                <button class="variation-btn text-danger" onclick="selectVariation('variation_b')">变例 B：大奖赛进攻</button>
                <button class="variation-btn" onclick="selectVariation('variation_c')">变例 C：f4–f5 王翼冲锋</button>
            </div>
        </div>

        <div class="board-area">
            <div id="statusInfo">准备就绪</div>
            <div id="myBoard"></div>
            <div class="controls">
                <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
                <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
                <button class="btn btn-primary" onclick="ChessApp.nextMove()">下一步 ▶</button>
                <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
            </div>
            <div id="fenDebug"></div>
        </div>

        <div class="info-area">
            <div id="hintText" class="hint-content">
                <h3>西西里防御 - 闭式西西里（g3 体系）</h3>
                <p>闭式西西里是一种稳健而富有攻击性的反西西里选择，白方避免开放中心，保留子力，常通过王翼兵推进制造突然的进攻机会；黑方则通常在后翼寻求反击。</p>
            </div>
        </div>
    </div>

    <script>
        // 棋谱数据 - 经过 GM 逻辑校验
        const VARIATIONS = {
            main_line: {
                title: "主线：闭式西西里 g3 王翼菲安凯托",
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "闭式西西里是一种稳健而富有攻击性的反西西里选择，白方避免开放中心，保留子力，常通过王翼兵推进制造突然的进攻机会；黑方则通常在后翼寻求反击。",
                moves: [
                    "e4", "c5", "Nc3", "Nc6", "g3", "g6", "Bg2", "Bg7",
                    "d3", "d6", "Be3", "e6", "Nge2", "Nge7", "O-O", "O-O"
                ],
                steps: [
                    "1.e4 白方占据中心，为后续发展奠定基础。",
                    "1...c5 黑方进入西西里防御，争夺d4格。",
                    "2.Nc3 白方选择反西西里路线，保持结构封闭与灵活性。",
                    "2...Nc6 黑方自然发展，进一步控制d4。",
                    "3.g3 白方准备王翼菲安凯托，进入闭式西西里结构。",
                    "3...g6 黑方对称菲安凯托，巩固暗格并准备后翼反击。",
                    "4.Bg2 白方象上长对角线，增强中心与王翼控制。",
                    "4...Bg7 黑方暗格象上场，重点盯防d4。",
                    "5.d3 白方稳固中心，保持兵链封闭。",
                    "5...d6 黑方支持中心暗格，并为子力发展打开线路。",
                    "6.Be3 白方发展子力，施压c5兵。",
                    "6...e6 黑方必须的一步！为马腾出e7格，并控制d5。",
                    "7.Nge2 白方骑士灵活出动，配合后续作战。",
                    "7...Nge7 黑方马跳至e7，保留f兵推进的可能性。",
                    "8.O-O 白方安全王位，准备王翼行动。",
                    "8...O-O 黑方完成王车易位，进入典型中局。"
                ]
            },
            variation_a: {
                title: "变例 A：开放西西里转置的可能",
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "若白方未立即下g3，而改走Nf3并d4，局面可转入开放西西里，黑方需避免被不熟悉的体系牵制。",
                moves: [
                    "e4", "c5", "Nc3", "Nc6", "Nf3", "e5"
                ],
                steps: [
                    "1.e4 白方占据中心。",
                    "1...c5 西西里防御。",
                    "2.Nc3 反西西里路线。",
                    "2...Nc6 自然发展。",
                    "3.Nf3 白方准备d4，暗示开放西西里。",
                    "3...e5 黑方封锁中心，拒绝立即开放。"
                ]
            },
            variation_b: {
                title: "变例 B：大奖赛进攻（Grand Prix Attack）",
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "白方通过早期f4制造王翼攻势，但若黑方准备充分，局面依然可控。",
                moves: [
                    "e4", "c5", "Nc3", "Nc6", "f4", "d5"
                ],
                steps: [
                    "1.e4 白方占据中心。",
                    "1...c5 西西里防御。",
                    "2.Nc3 反西西里路线。",
                    "2...Nc6 自然发展。",
                    "3.f4 白方主动争夺中心与王翼空间。",
                    "3...d5 黑方及时反击中心，削弱白方攻势。"
                ]
            },
            variation_c: {
                title: "变例 C：闭式西西里中的 f4–f5 王翼冲锋",
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "白方在完成基本发展后推进f4–f5，制造直接的王翼战术威胁，是闭式西西里的核心攻击思想。",
                moves: [
                    "e4", "c5", "Nc3", "Nc6", "g3", "g6", "Bg2", "Bg7",
                    "d3", "d6", "f4", "e5"
                ],
                steps: [
                    "1.e4 白方占据中心。",
                    "1...c5 西西里防御。",
                    "2.Nc3 反西西里路线。",
                    "2...Nc6 自然发展。",
                    "3.g3 白方准备王翼菲安凯托。",
                    "3...g6 黑方对称菲安凯托。",
                    "4.Bg2 白方象上长对角线。",
                    "4...Bg7 黑方暗格象上场。",
                    "5.d3 白方稳固中心。",
                    "5...d6 黑方支持中心。",
                    "6.f4 白方明确进攻意图，准备f5。",
                    "6...e5 黑方占据中心并控制d4，但让出d5弱点。"
                ]
            }
        };

        // 桥接函数：处理点击事件
        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
            } else {
                console.error('变例不存在:', key);
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function () {
            // 从标准开局位置开始（FEN: 初始棋盘）
            var startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

            // 启动应用
            window.ChessApp.init('myBoard', startFen);

            // 默认加载第一个变例
            selectVariation('main_line');

            // ========== 自动验证脚本 ==========
            console.log('========== 开始自动验证所有变例 ==========');
            var allPassed = true;
            Object.keys(VARIATIONS).forEach(function (key) {
                var variation = VARIATIONS[key];
                var testGame = new Chess(variation.fen);

                for (var i = 0; i < variation.moves.length; i++) {
                    var move = testGame.move(variation.moves[i]);
                    if (!move) {
                        console.error('❌ [' + key + '] 第' + i + '步无效: ' + variation.moves[i]);
                        console.error('   当前 FEN: ' + testGame.fen());
                        allPassed = false;
                        return;
                    }
                }

                console.log('✓ [' + key + '] 验证通过');
            });

            if (allPassed) {
                console.log('========== ✓ 所有变例验证通过！ ==========');
            } else {
                console.error('========== ❌ 部分变例验证失败，请检查！ ==========');
            }
        });
    </script>

</body>

</html>
