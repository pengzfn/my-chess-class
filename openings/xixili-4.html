        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);

                // 侧边栏高亮：不改变模板 DOM，仅基于 onclick 匹配 key
                try {
                    var buttons = document.querySelectorAll('.variation-btn');
                    buttons.forEach(function (btn) {
                        btn.classList.remove('active');
                    });

                    var target = null;
                    buttons.forEach(function (btn) {
                        var handler = btn.getAttribute('onclick') || '';
                        if (handler.indexOf("'" + key + "'") !== -1) {
                            target = btn;
                        }
                    });

                    if (target) target.classList.add('active');
                } catch (e) {
                    console.warn('Sidebar highlight failed:', e);
                }
            } else {
                console.error('变例不存在:', key);
            }
        }
