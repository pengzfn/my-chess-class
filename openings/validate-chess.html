<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
<h2>棋步验证</h2>
<pre id="output"></pre>
<script>
const output = document.getElementById('output');
let log = '';

// 变例1
log += '=== 变例1：主线 ===\n';
const moves1 = ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Bc5", "Be3", "Qf6", "c3", "Nge7", "Bc4", "Ne5", "Be2", "Qg6", "O-O", "d6", "f4", "Qxe4", "Bf2", "Bxd4", "cxd4", "Ng6", "g3", "O-O", "Nc3", "Qf5", "d5"];
const game1 = new Chess();
for(let i = 0; i < moves1.length; i++) {
  const result = game1.move(moves1[i]);
  if(!result) {
    log += `❌ 第${i+1}步 "${moves1[i]}" 失败!\n`;
    log += `   当前FEN: ${game1.fen()}\n`;
    log += `   轮到: ${game1.turn() === 'w' ? '白方' : '黑方'}\n`;
    break;
  }
  log += `✓ ${i+1}. ${moves1[i]}\n`;
}

// 变例6
log += '\n=== 变例6：Bh3防守 ===\n';
const moves6 = ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Nxd4", "Bc5", "Be3", "Qf6", "c3", "Nge7", "Bc4", "Ne5", "Be2", "Qg6", "O-O", "d6", "f4", "Qxe4", "Bf2", "Bxd4", "cxd4", "Ng6", "g3", "Bh3", "Bf3", "Qf5"];
const game6 = new Chess();
for(let i = 0; i < moves6.length; i++) {
  const result = game6.move(moves6[i]);
  if(!result) {
    log += `❌ 第${i+1}步 "${moves6[i]}" 失败!\n`;
    log += `   当前FEN: ${game6.fen()}\n`;
    log += `   轮到: ${game6.turn() === 'w' ? '白方' : '黑方'}\n`;
    break;
  }
  log += `✓ ${i+1}. ${moves6[i]}\n`;
}

output.textContent = log;
</script>
</body>
</html>
