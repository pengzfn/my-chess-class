    <div class="container">
        <div class="sidebar">
            <h3>🎯 意大利开局体系</h3>

            </div>
            <div class="variation-list">

            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>黑方应对选择</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn text-danger" onclick="selectVariation('var_a_mistake')">变例A：贪兵错误（Nxe4?）</button>
                <button class="variation-btn" onclick="selectVariation('var_b_correct')">变例B：正确兑换（exd4）</button>
                <button class="variation-btn" onclick="selectVariation('var_c_check')">变例C：象将军（Bb4+）</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>白方应将方案</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn text-danger" onclick="selectVariation('var_d_wrong')">变例D：错误用马垫（Nc3?）</button>
                <button class="variation-btn" onclick="selectVariation('var_e_correct')">变例E：正确用象垫（Bd2）</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>核心战术</span>
                <span class="arrow arrow-open">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('var_f_sacrifice')">变例F：先弃后取战术（Bxf7+）</button>
                <button class="variation-btn" onclick="selectVariation('var_g_defense')">变例G：黑方防守与平衡</button>
            </div>
        </div>

        <div class="board-area">
            <div id="statusInfo">准备就绪</div>
            <div id="myBoard"></div>
            <div class="controls">
                <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
                <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
                <button class="btn btn-primary" onclick="ChessApp.nextMove()">下一步 ▶</button>
                <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
            </div>
            <div id="fenDebug"></div>
        </div>

        <div class="info-area">
            <div id="hintText" class="hint-content">
                <h3>意大利开局（Italian Game）— 全应对覆盖教学版</h3>

            </div>
        </div>
    </div>

                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                description: "黑方通过精确防守，可以保持局面相对平衡。这是实战中常见的复杂中局。",

        // 桥接函数：处理点击事件
        function selectVariation(key) {
            if (VARIATIONS && VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
            } else {
                console.error('变例不存在:', key);
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function () {
            var startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
            window.ChessApp.init('myBoard', startFen);
            
            // 默认加载第一个变例
            selectVariation('main_line_basic');

            // ========== 自动验证脚本 ==========
            console.log('🔍 开始验证所有变例的走法合法性...\n');
            var totalVariations = Object.keys(VARIATIONS).length;
            var passedCount = 0;
            var failedCount = 0;

            Object.keys(VARIATIONS).forEach(function(key) {
                var v = VARIATIONS[key];
                var g = new Chess(v.fen);
                var allValid = true;
                
                for (var i = 0; i < v.moves.length; i++) {
                    var moveResult = g.move(v.moves[i]);
                    if (!moveResult) {
                        console.error('❌ [' + key + '] 第' + (i+1) + '步无效: ' + v.moves[i]);
                        console.error('   当前FEN: ' + g.fen());
                        allValid = false;
                        failedCount++;
                        return;
                    }
                }
                
                if (allValid) {
                    console.log('✓ [' + key + '] 验证通过 (' + v.moves.length + '步)');
                    passedCount++;
                }
            });

            console.log('\n========== 验证报告 ==========');
            console.log('总变例数: ' + totalVariations);
            console.log('通过: ' + passedCount);
            console.log('失败: ' + failedCount);
            console.log('==============================\n');
        });
