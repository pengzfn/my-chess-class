<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格兰开局 - 第三讲：Mieses 变例深度解析</title>

    <!-- 使用稳定的 cdnjs 链接 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script src="chess-logic.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            /* 深紫色大师风格 */
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .container {
            display: flex;
            gap: 20px;
            height: 90vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 40px;
        }

        /* 磨砂玻璃卡片通用样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 左侧边栏 */
        .sidebar {
            flex: 0 0 300px;
            overflow-y: auto;
        }

        .category-header {
            background: rgba(237, 137, 54, 0.3);
            /* 橙色调，代表进攻 */
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .arrow {
            transition: transform 0.3s;
        }

        .variation-list {
            display: block;
            padding-left: 10px;
            margin-top: 5px;
        }

        .variation-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #ccc;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .variation-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding-left: 12px;
        }

        /* 中间棋盘区 */
        .board-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #myBoard {
            width: 100%;
            max-width: 480px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #ed8936;
            /* 橙色按钮 */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #dd6b20;
        }

        /* 右侧解说区 */
        .info-area {
            flex: 0 0 250px;
            overflow-y: auto;
        }

        #statusInfo {
            font-size: 1.2em;
            color: #f6ad55;
            margin-bottom: 10px;
        }

        .hint-content ul {
            padding-left: 20px;
            color: #a0aec0;
            list-style: none;
        }

        .hint-content li {
            margin-bottom: 8px;
            transition: all 0.3s;
        }
    </style>
</head>

<body>

    <a href="scotland-intro.html" class="back-link">← 返回目录</a>

    <div class="container">
        <div class="sidebar glass-card">
            <h3>⚔️ 第三讲：Mieses 变例深度解析</h3>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>核心理论</span>
                <span class="arrow" style="transform: rotate(90deg)">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('mieses_intro')">1. 为什么选择 Mieses 变例？</button>
                <button class="variation-btn" onclick="selectVariation('main_line')">2. 主线：e5 兵的压制</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>常见陷阱与错误</span>
                <span class="arrow" style="transform: rotate(90deg)">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" style="color:#fc8181" onclick="selectVariation('mistake_nd5')">3.
                    错误：4...Nd5?</button>
                <button class="variation-btn" style="color:#fc8181" onclick="selectVariation('mistake_g6')">4.
                    错误：6...g6?</button>
            </div>

            <div class="category-header" onclick="toggleSidebarCategory(this)">
                <span>实战演示</span>
                <span class="arrow" style="transform: rotate(90deg)">▶</span>
            </div>
            <div class="variation-list">
                <button class="variation-btn" onclick="selectVariation('game_demo')">5. 精彩对局：惩罚 g6</button>
            </div>
        </div>

        <div class="board-area">
            <div id="statusInfo">准备就绪</div>
            <div id="myBoard"></div>
            <div class="controls">
                <button class="btn" onclick="ChessApp.reset()">⟲ 重置</button>
                <button class="btn" onclick="ChessApp.prevMove()">◀ 上一步</button>
                <button class="btn" onclick="ChessApp.nextMove()">下一步 ▶</button>
                <button class="btn" onclick="ChessApp.flipBoard()">🔄 翻转</button>
            </div>
        </div>

        <div class="info-area glass-card">
            <div id="hintText" class="hint-content">
                <h3>特级大师 Alexander Delchev 讲座</h3>
                <p>本节课基于 GM Delchev 的视频讲解，深入分析苏格兰开局中最神秘、最尖锐的 Mieses 变例 (4...Nf6)。</p>
                <p><strong>核心思想：</strong>白方利用 e5 兵挤压黑方空间，并利用异向易位发起猛烈进攻。</p>
            </div>
        </div>
    </div>

    <script>
        // 定义变例数据 - 基于 GM Alexander Delchev 视频讲座
        // 苏格兰开局 Mieses 变例 (4...Nf6)
        const VARIATIONS = {
            mieses_intro: {
                title: "为什么选择 Mieses 变例？",
                // 起始局面：1.e4 e5 2.Nf3 Nc6 3.d4 后，轮到黑方走棋
                fen: "r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3",
                description: "4...Nf6 是卡尔波夫、克拉姆尼克等大师的选择。白方应避免 5.Nc3（允许 Bb4 牵制），而应果断走 5.Nxc6 交换！",
                moves: [
                    "exd4",  // 3...exd4
                    "Nxd4",  // 4.Nxd4
                    "Nf6",   // 4...Nf6 攻击 e4 兵
                    "Nxc6",  // 5.Nxc6! 关键，避免 Nc3 后 Bb4
                    "bxc6",  // 5...bxc6 (dxc6 不好，后位置差)
                    "e5"     // 6.e5! 驱赶马，占据空间
                ],
                steps: [
                    "3...exd4",
                    "4.Nxd4",
                    "4...Nf6 攻击 e4 兵，保留象的发展选择",
                    "5.Nxc6! 关键一步，避免 5.Nc3 Bb4 的复杂局面",
                    "5...bxc6 只能这样吃",
                    "6.e5! 核心思路：驱马赢先手，占据空间"
                ]
            },
            main_line: {
                title: "主线：Qe7 牵制与 c4 驱马",
                // 局面：6.e5 后，轮到黑方
                fen: "r1bqkb1r/p1pp1ppp/2p2n2/4P3/8/8/PPP2PPP/RNBQKB1R b KQkq - 0 6",
                description: "面对 e5，黑方最强应对是 6...Qe7! 牵制 e 兵。白方则用 Qe2 解除牵制，再用 c4 驱赶黑马。",
                moves: [
                    "Qe7",   // 6...Qe7! 牵制
                    "Qe2",   // 7.Qe2 解除牵制
                    "Nd5",   // 7...Nd5 马跳中心
                    "c4",    // 8.c4! 驱赶马
                    "Ba6",   // 8...Ba6 牵制 c4 兵
                    "b3",    // 9.b3 保护 c4
                    "O-O-O"  // 9...O-O-O 黑方长易位（有风险）
                ],
                steps: [
                    "6...Qe7! 牵制 e5 兵",
                    "7.Qe2 解除牵制",
                    "7...Nd5 马跳回中心",
                    "8.c4! 驱赶黑马，为白马腾出 c3",
                    "8...Ba6 牵制 c4 兵",
                    "9.b3 巩固中心",
                    "9...O-O-O 黑方长易位（但 a 线开放有风险）"
                ]
            },
            mistake_nd5: {
                title: "错误：6...Nd5? (直接跳马)",
                // 局面：6.e5 后
                fen: "r1bqkb1r/p1pp1ppp/2p2n2/4P3/8/8/PPP2PPP/RNBQKB1R b KQkq - 0 6",
                description: "黑方如果不先走 Qe7 牵制，而直接跳马 Nd5，会陷入发展困难。",
                moves: [
                    "Nd5",   // 6...Nd5? 自然但不精确
                    "c4",    // 7.c4 驱马
                    "Nb6",   // 7...Nb6 马退边
                    "Nc3",   // 8.Nc3 正常发展
                    "Bb4",   // 8...Bb4 试图牵制
                    "Qg4"    // 9.Qg4! 攻击 g7，黑方麻烦
                ],
                steps: [
                    "6...Nd5? 自然但不精确",
                    "7.c4 驱马",
                    "7...Nb6 马被迫退边",
                    "8.Nc3 白马发展",
                    "8...Bb4 试图牵制",
                    "9.Qg4! 攻击 g7，若短易位则 Bh6 得子"
                ]
            },
            mistake_g6: {
                title: "错误：g6? (在主线中的失误)",
                // 局面：主线进行若干回合后，黑方试图 fianchetto
                fen: "r3kb1r/p1ppqppp/2p5/3nP3/2P5/1PN5/P3QPPP/R1B1KB1R b KQkq - 0 9",
                description: "在主线中，黑方试图走 g6 准备 Bg7，但这是一个开局失误，白方可以立即惩罚。",
                moves: [
                    "g6",    // 9...g6? 失误
                    "Qe4",   // 10.Qe4! 后切入，威胁 Nf6+
                    "Bg7",   // 10...Bg7 被迫
                    "Bg5",   // 11.Bg5! 弃 e5 兵攻击
                    "Qxe5",  // 11...Qxe5 贪吃
                    "Qxe5",  // 12.Qxe5 换后
                    "Bxe5"   // 12...Bxe5
                ],
                steps: [
                    "9...g6? 试图 fianchetto，但这是失误",
                    "10.Qe4! 后切入中心，威胁 Nf6+",
                    "10...Bg7 被迫出象",
                    "11.Bg5! 弃兵发起进攻",
                    "11...Qxe5 贪吃 e5 兵",
                    "12.Qxe5 Bxe5",
                    "白方利用阵型缺陷保持持续攻势"
                ]
            },
            game_demo: {
                title: "精彩对局：惩罚 g6 的完整战术",
                // 从主线 g6 失误后的局面开始
                // FEN 说明：黑方刚走 g6（兵从g7到g6），象在 a6，g7 格空
                // 局面：1.e4 e5 2.Nf3 Nc6 3.d4 exd4 4.Nxd4 Nf6 5.Nxc6 bxc6 6.e5 Qe7 7.Qe2 Nd5 8.c4 Ba6 9.b3 g6
                fen: "r3kb1r/p1ppqp1p/b1p3p1/3nP3/2P5/1PN5/P3QPPP/R1B1KB1R w KQkq - 0 10",
                description: "2017年西班牙公开赛中的经典攻击。白方利用 Ne4! 威胁 Nf6+，再用 Bg5! 弃兵发起猛烈进攻。",
                moves: [
                    "Ne4",    // 10.Ne4! 威胁 Nf6+
                    "Bg7",    // 10...Bg7 被迫出象 (现在 g7 是空的，可以走)
                    "Bg5",    // 11.Bg5! 弃 e5 兵，发起攻击
                    "Qb4+",   // 11...Qb4+ 将军争取时间
                    "Qd2",    // 12.Qd2 挡驾
                    "Qxd2+",  // 12...Qxd2+ 换后
                    "Kxd2",   // 13.Kxd2
                    "Bxe5",   // 13...Bxe5 吃回兵
                    "Nf6+",   // 14.Nf6+! 抽将！
                    "Kf8",    // 14...Kf8 (若 gxf6 则 Bxf6 攻击 h8 车)
                    "Nxd5",   // 15.Nxd5 吃回马
                    "cxd5",   // 15...cxd5
                    "Bxd5",   // 16.Bxd5 双象控制开放线
                    "h4",     // 17.h4! 开始 h 线进攻
                    "h6",     // 17...h6
                    "Bxh6"    // 18.Bxh6! 弃象破坏王城
                ],
                steps: [
                    "10.Ne4! 威胁 Nf6+ 得子",
                    "10...Bg7 被迫出象防守",
                    "11.Bg5! 精彩弃兵！发起攻势",
                    "11...Qb4+ 试图换后",
                    "12.Qd2 Qxd2+ 13.Kxd2",
                    "13...Bxe5 黑方吃回 e5 兵",
                    "14.Nf6+! 抽将！精彩战术",
                    "14...Kf8 (若 gxf6 则 Bxf6)",
                    "15.Nxd5 cxd5 16.Bxd5",
                    "白方双象占据开放斜线",
                    "17.h4! 开始进攻王翼",
                    "17...h6",
                    "18.Bxh6! 弃象杀王！白胜在望"
                ]
            }
        };

        // 桥接函数
        function selectVariation(key) {
            if (VARIATIONS[key]) {
                window.ChessApp.loadVariation(VARIATIONS[key]);
            }
        }

        // 侧边栏折叠
        window.toggleSidebarCategory = function (headerElement) {
            var content = headerElement.nextElementSibling;
            var arrow = headerElement.querySelector('.arrow');

            if (content.style.display === 'block') {
                content.style.display = 'none';
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'block';
                if (arrow) arrow.style.transform = 'rotate(90deg)';
            }
        };

        // 初始化
        $(document).ready(function () {
            var startFen = 'rnbqkbnr/pppp1ppp/8/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3';
            window.ChessApp.init('myBoard', startFen);
            selectVariation('mieses_intro');
        });
    </script>

</body>

</html>
